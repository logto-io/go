name: Release

on:
  push:
    tags:
      - v*.*.*

concurrency:
  group: release-${{ github.ref }}

jobs:
  create-github-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog
        run: |
          git diff HEAD~1 HEAD --exit-code -- CHANGELOG.md | \
          tail -n +5 | \
          grep -E "^\+" | \
          sed -E 's/^\+//' | \
          cat -s \
          > /tmp/changelog.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.BOT_PAT }}
          body_path: /tmp/changelog.txt

  update-go-module-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go Env
        uses: actions/setup-go@v7
        with:
          go-version: '^1.19'

      # https://pkg.go.dev/about#adding-a-package
      - name: Request proxy.golang.org to update go module index
        run: |
          MODULE_NAME="$(go list -m)"
          curl -fsS "https://proxy.golang.org/$MODULE_NAME/@v/${GITHUB_REF#refs/*/}.info"
